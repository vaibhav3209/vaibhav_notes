site_name: Vaibhav Notes
site_url: ""
use_directory_urls: false

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy
  palette:
    - scheme: default

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - md_in_html
  - attr_list
  - pymdownx.superfences
  - tables

hooks:
  - hooks/notes_hooks.py

nav:
  - Home: index.md
  - SQL:
      - Null Semantics: SQL/NULL_SEMANTICS.md