site_name: Vaibhav Notes
site_url: ""
use_directory_urls: false

#................................
# Themes Available
#     name: material
#     name: readthedocs
#     name: simple-blog
#     name: torillic
#................................
theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light

extra_css:
  - stylesheets/extra.css


extra_javascript:
  - javascripts/notebook-toggle.js


markdown_extensions:
  - md_in_html
  - attr_list
  - pymdownx.superfences
  - tables

hooks:
  - hooks/notes_hooks.py

nav:
  - Home: index.md
  - SQL:
      - Null Semantics: SQL/NULL_SEMANTICS.md
  - DVER:
      - First M.D.T. : DVER/First_MDT.md
  - EEDM:
      - First M.D.T.: EEDM/First_MDT.md