site_name: Vaibhav Notes
site_url: https://vaibhav3209.github.io/vaibhav_notes/
repo_url: https://github.com/vaibhav3209/vaibhav_notes
use_directory_urls: false

theme:
  name: material

  icon:
    repo: fontawesome/brands/github

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy


extra_css:
  - stylesheets/extra.css


markdown_extensions:
  - md_in_html
  - attr_list
  - tables
  - pymdownx.superfences:
        custom_fences:
          - name: mermaid
            class: mermaid
            format: !!python/name:pymdownx.superfences.fence_code_format


nav:
  - Home: index.md
  - SQL:  topics/sql/index.md
  - DVER: topics/DVER/First_MDT.md
  - EEDM: topics/EEDM/First_MDT.md
